<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGY ORB: CORE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #00f3ff;
        }

        #orb-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Deep space radial gradient */
            background: radial-gradient(circle at center, #0a1122 0%, #000000 70%);
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00f3ff;
            margin: 0;
        }

        .status {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

    <div class="ui-overlay">
        <h1>ENERGY ORB</h1>
        <div class="status">SYSTEM: ACTIVE | OUTPUT: 100% | NEURAL LINK: STABLE</div>
        <div class="status" style="color: #ff00ff; margin-top: 5px;">LIGHTNING DISCHARGE: ENABLED</div>
    </div>

    <div id="orb-container"></div>

    <!-- Import our Class -->
    <script src="js/energy_orb.js"></script>

    <script>
        if (typeof THREE === 'undefined') {
            console.error("Three.js not loaded!");
        } else {
            console.log("Initializing Energy Orb...");
            const orb = new EnergyOrb('orb-container');
        }
    </script>
</body>

</html>
