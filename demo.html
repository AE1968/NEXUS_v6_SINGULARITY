<!DOCTYPE html>
<html lang="en">

    <link

    <style>
        :root {
            --cyan: #00f3ff;
            --pink: #ff00ff;
            --bg: #050505;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--cyan);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #hologram-container {
            width: 800px;
            height: 600px;
            position: relative;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            background: radial-gradient(circle at center, rgba(0, 15, 30, 0.8) 0%, #000 100%);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 20px var(--cyan);
        }

        #speech-text {
            position: absolute;
            top: 40px;
            width: 80%;
            text-align: center;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--cyan);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .visualizer-container {
            position: absolute;
            bottom: 100px;
            display: flex;
            gap: 3px;
            height: 40px;
            align-items: flex-end;
        }

        .v-bar {
            width: 4px;
            background: var(--cyan);
            transition: height 0.1s;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 243, 255, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.2;
        }
    </style>
</head>

<body>

        <div class="visualizer-container" id="visualizer">

    </div>

        window.HologramSystem = HologramSystem;

        async function triggerSpeech(lang) {
            const text = lang === 'ro' 
                ? "Sistemul KELION v143.0 este acum complet activat. Toate funcțiile 3D, in clusiv Sfera de Energie și Sincron izarea Buzelor, sunt operaționale. Puterea și calmul absolut sunt elementele mele definitorii. Cum pot continu                : "The KELION v143.0 system is now fully activated. All 3D functions, including the Energy Sphere and Lip Sync, are operational. Absolute power and calm are my defining elements. How can I continue to assist you?";
            
            const speechEl = document.getElementById('speech-text');
            speechEl.textContent = text;
            speechEl.style.opacity = '1';

            try {
                // Initializing LipSyncSystem
                if (window.LipSyncSystem) {
                    window.LipSyncSystem.init();
                }

                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text, gender: 'male', username: 'demo'})
                });
                
                if (!response.ok) throw new Error("TTS failed");
                      const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                
                if (window.LipSyncSystem) {
                    window.LipSyncSystem.connectAudio(audio);
                }

                HologramSystem.isSpeaking = true;
                if (window.EnergySphere) window.EnergySphere.intensify();

                audio.onended = () => {
                    HologramSystem.isSpeaking = false;
                    speechEl.style.opacity = '0';
                    if (window.EnergySphere) window.EnergySphere.calm();
                };

                audio.play().catch(e => console.error("Audio play error:", e));

                // Visualizer bars
                const viz = document.getElementById('visualizer');
                viz.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'v-bar';
                    viz.appendChild(bar);
                }

                function updateViz() {
                    if (!HologramSystem.isSpeaking) return;
                    const bars = document.querySelectorAll('.v-bar');
                    bars.forEach(bar => {
                        bar.style.height = (5 + Math.random() * 35) + 'px';
                    });
                    requestAnimationFrame(updateViz);
                }
                updateViz();

            } catch (err) {
                console.error(err);
                alert("Speech error: " + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => HologramSystem.init());
    </script>
</body>

</html>
