<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELION v143.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Fundal spațiu cosmic - fullscreen */
        #bg-space {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(0, 243, 255, 0.1) 0%, transparent 50%, rgba(255, 0, 255, 0.1) 100%),
                url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80") no-repeat center center / cover;
            z-index: 0;
        }

        /* Container sferă - centrat */
        #sphere-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            #sphere-container {
                width: 350px;
                height: 350px;
            }
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
    <!-- Fundal spațiu -->
    <div id="bg-space"></div>

    <!-- Container pentru sfera plasma cu cap -->
    <div id="sphere-container"></div>

    <script>
        // ==================================================================
        // SFERA PLASMA ANIMATĂ CU CAP ANIMAT
        // ==================================================================
        class PlasmaSphere {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;

                this.scene = new THREE.Scene();
                this.clock = new THREE.Clock();
                this.streamers = [];

                this.colors = {
                    cyan: new THREE.Color(0x00f3ff),
                    magenta: new THREE.Color(0xff00ff)
                };

                this.init();
            }

            init() {
                // Camera
                this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
                this.camera.position.z = 4.2;

                // Renderer transparent
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 1.5;
                this.container.appendChild(this.renderer.domElement);

                // Creează sfera de sticlă
                this.createGlassSphere();

                // Încarcă capul 3D
                this.loadHead();

                // Pornește animația
                this.animate();

                console.log('✅ PlasmaSphere initialized');
            }

            createGlassSphere() {
                // Sfera exterioară din sticlă
                const glassGeo = new THREE.SphereGeometry(1.6, 64, 64);
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff,
                    roughness: 0,
                    metalness: 0.1,
                    transmission: 0.9,
                    thickness: 0.5,
                    transparent: true,
                    opacity: 0.3
                });
                this.glassSphere = new THREE.Mesh(glassGeo, glassMat);
                this.scene.add(this.glassSphere);

                // Glow interior (atmosferă gazoasă)
                const gasGeo = new THREE.SphereGeometry(1.5, 64, 64);
                const gasMat = new THREE.ShaderMaterial({
                    uniforms: { viewVector: { value: this.camera.position } },
                    vertexShader: `
                    uniform vec3 viewVector;
                    varying float intensity;
                    void main() {
                        vec3 vNormal = normalize(normalMatrix * normal);
                        vec3 vView = normalize(normalMatrix * viewVector);
                        intensity = pow(0.7 - dot(vNormal, vView), 3.0);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                    fragmentShader: `
                    varying float intensity;
                    void main() {
                        vec3 gas = vec3(0.1, 0.0, 0.3);
                        gl_FragColor = vec4(gas, intensity * 0.8);
                    }
                `,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                this.scene.add(new THREE.Mesh(gasGeo, gasMat));
            }

            loadHead() {
                const loader = new THREE.GLTFLoader();
                loader.load('assets/hologram.glb', (gltf) => {
                    this.headModel = gltf.scene;
                    this.headModel.position.set(0, -0.6, 0);
                    this.headModel.scale.set(1.4, 1.4, 1.4);

                    // Material holografic cyan/magenta
                    const holoMat = new THREE.MeshBasicMaterial({
                        color: 0x00f3ff,
                        transparent: true,
                        opacity: 0.9
                    });

                    this.headModel.traverse((obj) => {
                        if (obj.isMesh) obj.material = holoMat;
                    });

                    this.scene.add(this.headModel);

                    // Creează streamers plasma DUPĂ ce capul e încărcat
                    this.createPlasmaStreamers();

                    // Animații dacă există
                    if (gltf.animations.length) {
                        this.mixer = new THREE.AnimationMixer(this.headModel);
                        this.mixer.clipAction(gltf.animations[0]).play();
                    }

                    console.log('✅ Head model loaded');
                });
            }

            createPlasmaStreamers() {
                const streamerCount = 8;
                for (let i = 0; i < streamerCount; i++) {
                    const segmentCount = 20;
                    const curve = new THREE.CatmullRomCurve3(
                        new Array(segmentCount).fill(new THREE.Vector3(0, 0, 0))
                    );

                    const geometry = new THREE.TubeGeometry(curve, segmentCount, 0.02, 3, false);
                    const material = new THREE.MeshBasicMaterial({
                        color: Math.random() > 0.5 ? this.colors.cyan : this.colors.magenta,
                        transparent: true,
                        opacity: 0.9,
                        blending: THREE.AdditiveBlending
                    });

                    const streamer = new THREE.Mesh(geometry, material);
                    streamer.userData = {
                        target: this.randomSurfacePoint(),
                        phase: Math.random() * Math.PI * 2,
                        speed: 1.5 + Math.random() * 2.0,
                        amplitude: 0.15 + Math.random() * 0.15,
                        segments: segmentCount
                    };

                    this.streamers.push(streamer);
                    this.scene.add(streamer);
                }
            }

            randomSurfacePoint() {
                const r = 1.55;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                return new THREE.Vector3(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }

            updateStreamers(time) {
                this.streamers.forEach(streamer => {
                    const start = new THREE.Vector3(0, 0.1, 0);
                    const end = streamer.userData.target;

                    // Target wanders slowly
                    if (Math.random() < 0.03) {
                        streamer.userData.target.lerp(this.randomSurfacePoint(), 0.3)
                            .normalize().multiplyScalar(1.55);
                    }

                    // Calculate new curve points with plasma wiggle
                    const points = [];
                    const segments = streamer.userData.segments;

                    for (let i = 0; i <= segments; i++) {
                        const t = i / segments;
                        const base = new THREE.Vector3().lerpVectors(start, end, t);

                        const wiggleX = Math.sin(t * 12 + time * streamer.userData.speed + streamer.userData.phase)
                            * streamer.userData.amplitude * Math.sin(t * Math.PI);
                        const wiggleY = Math.cos(t * 9 + time * streamer.userData.speed)
                            * streamer.userData.amplitude * Math.sin(t * Math.PI);
                        const wiggleZ = Math.sin(t * 15 + time) * streamer.userData.amplitude * 0.5 * Math.sin(t * Math.PI);

                        base.add(new THREE.Vector3(wiggleX, wiggleY, wiggleZ));
                        points.push(base);
                    }

                    // Update geometry
                    const newCurve = new THREE.CatmullRomCurve3(points);
                    streamer.geometry.dispose();
                    streamer.geometry = new THREE.TubeGeometry(newCurve, segments, 0.015, 3, false);

                    // Pulse opacity
                    streamer.material.opacity = 0.7 + Math.sin(time * 15 + streamer.userData.phase) * 0.3;
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = this.clock.getDelta();
                const time = this.clock.getElapsedTime();

                // Update plasma streamers
                this.updateStreamers(time);

                // Rotate glass sphere slowly
                if (this.glassSphere) {
                    this.glassSphere.rotation.y = time * 0.05;
                }

                // Update head animations
                if (this.mixer) this.mixer.update(delta);

                // Gentle head floating
                if (this.headModel) {
                    this.headModel.position.y = -0.6 + Math.sin(time) * 0.02;
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        // Inițializare când pagina e gata
        window.addEventListener('load', () => {
            new PlasmaSphere('sphere-container');
        });
    </script>
</body>

</html>
