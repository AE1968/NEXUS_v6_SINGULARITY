<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hologram Debug Test</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
    </style>
    <!-- UPDATED LIBRARIES TO FIX FBX PARSING ERROR -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        // Logica trebuie mutata in modul
        window.startApp = (logFn) => {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0x00ffff, 2);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            const loader = new FBXLoader();
            const path = 'assets/kelion_holo/hologram.fbx';

            logFn(`Loading (v150): ${path}`);

            loader.load(path, (fbx) => {
                logFn('LOADED SUCCESSFULLY (v150)!');
                const box = new THREE.Box3().setFromObject(fbx);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                logFn(`Size: ${size.x.toFixed(2)} x ${size.y.toFixed(2)}`);

                fbx.position.sub(center);
                const scale = 4.0 / (size.y || 1);
                fbx.scale.set(scale, scale, scale);
                scene.add(fbx);

                function animate() {
                    requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                }
                animate();
            }, (xhr) => {
                if (xhr.lengthComputable) {
                    const pct = Math.round(xhr.loaded / xhr.total * 100);
                    logFn(`Downloading: ${pct}%`);
                }
            }, (err) => {
                logFn(`ERROR: ${err.message}`);
                console.error(err);
            });
        };
    </script>
</head>

<body>
    <div id="debug"
        style="position:fixed; top:10px; left:10px; color:#0f0; background:rgba(0,0,0,0.8); padding:10px; font-family:monospace; white-space:pre;">
        INITIALIZING...</div>
    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById('debug').textContent += '\n' + msg;
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0x00ffff, 2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // Grid
        const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(grid);

        // Load Model
        const loader = new THREE.FBXLoader();
        const path = 'assets/kelion_holo/hologram.fbx';

        log(`Loading: ${path}`);

        loader.load(path, (fbx) => {
            log('LOADED!');

            // Analyze
            const box = new THREE.Box3().setFromObject(fbx);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            log(`Raw Size: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`);

            // Center & Scale
            fbx.position.sub(center);
            const targetHeight = 4.0;
            const scale = targetHeight / (size.y || 1);
            fbx.scale.set(scale, scale, scale);

            log(`Scaled by: ${scale.toFixed(4)}`);

            scene.add(fbx);

            // Animations
            if (fbx.animations.length) {
                log(`Found ${fbx.animations.length} animations`);
                const mixer = new THREE.AnimationMixer(fbx);
                const action = mixer.clipAction(fbx.animations[0]);
                action.play();

                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    mixer.update(clock.getDelta());
                    renderer.render(scene, camera);
                }
                animate();
            } else {
                log("No animations found.");
                function animate() {
                    requestAnimationFrame(animate);
                    fbx.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
            }

        }, (xhr) => {
            if (xhr.lengthComputable) {
                const pct = Math.round(xhr.loaded / xhr.total * 100);
                document.getElementById('debug').textContent = `Loading: ${path}\nProgress: ${pct}%`;
            }
        }, (err) => {
            log(`ERROR: ${err.message}`);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
